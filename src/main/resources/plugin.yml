name: MJTBox
version: ${project.version}
main: com.mjt.box.paper.MjtPaperPlugin
api-version: '1.19'
load: STARTUP
author: MJT
description: MJT Box - Virtual Network Manager & Rootless Linux Sandbox
commands:
  mjt:
    description: Quan ly MJT Box (mang ao va Linux PRoot) trong Paper
    usage: /mjt <status|reload|setup|boot|restart|confirm|cancel|exec|log|stop-os>
    permission: mjt.admin
permissions:
  mjt.admin:
    description: Quyen quan tri MJT Box
    default: op
